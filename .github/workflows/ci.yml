name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -race

      - name: Build
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # v8 is the first action release that installs golangci-lint v2, which
      # this repo's `version: "2"` config needs. Pin the linter itself too:
      # `latest` on the v6 action resolved to a v1 build compiled with Go 1.24,
      # which refuses a go.mod targeting 1.25.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
